<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mark Harvest</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');

    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg: #0f172a;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --card-bg: #1e293b;
    }

    body {
      width: 320px;
      margin: 0;
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      padding: 1.5rem;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #818cf8 0%, #6366f1 100%);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.25rem;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.025em;
    }

    .description {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }

    .button {
      appearance: none;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    .button:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }

    .button:active {
      transform: translateY(0);
    }

    .button:disabled {
      background-color: var(--card-bg);
      color: var(--text-muted);
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .status {
      margin-top: 1rem;
      font-size: 0.75rem;
      text-align: center;
      min-height: 1.2em;
    }

    .status.success { color: #4ade80; }
    .status.error { color: #f87171; }

    .footer {
      margin-top: 1.5rem;
      border-top: 1px solid #334155;
      padding-top: 1rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
    }

    .options-section {
      margin-bottom: 1.5rem;
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 0.75rem;
    }
    
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      cursor: pointer;
    }
    
    .template-inputs {
      margin-top: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    
    .input-group label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }
    
    .template-textarea {
      width: 100%;
      background-color: var(--bg);
      border: 1px solid #334155;
      color: var(--text);
      border-radius: 6px;
      padding: 0.5rem;
      font-family: inherit;
      font-size: 0.75rem;
      resize: vertical;
      box-sizing: border-box;
    }
    
    .template-textarea:focus {
      outline: none;
      border-color: var(--primary);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo"><img src="/public/icons/icon48.png" alt="Mark Harvest Logo"></div>
    <h1>Mark Harvest</h1>
  </div>

  <p class="description">
    Extract the main content from this page and copy it as Markdown to your clipboard.
  </p>

  <div class="options-section">
    <label class="checkbox-label">
      <input type="checkbox" id="wrapEnabled">
      Add Prefix/Suffix
    </label>
    <div id="templateInputs" class="template-inputs" style="display: none;">
      <div class="input-group">
        <label for="prefixText">Prefix</label>
        <textarea id="prefixText" rows="1" class="template-textarea"></textarea>
      </div>
      <div class="input-group">
        <label for="suffixText">Suffix</label>
        <textarea id="suffixText" rows="1" class="template-textarea"></textarea>
      </div>
    </div>
  </div>

  <button id="harvestBtn" class="button">
    <span>Harvest Content</span>
  </button>

  <div id="status" class="status"></div>

  <div class="footer">
    Ready to collect knowledge.
  </div>

  <script src="/src/popup/popup.ts" type="module"></script>
</body>
</html>
